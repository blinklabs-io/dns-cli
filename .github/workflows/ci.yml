name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
            - name: Checkout apollo dependency
              run: |
                  git clone --depth 1 https://github.com/Salvionied/apollo.git ../apollo || true
            - run: go mod download
            - run: go vet ./...
            - run: go test -race ./...
            - run: go build -o dns-cli ./cmd/dns-cli
            - name: Reject Apollo v1 imports
              run: |
                  if grep -RInE --exclude-dir=docs --exclude-dir=.git \
                    'github.com/Salvionied/apollo([^/]|$)' \
                    --include='*.go' .; then
                    echo "Forbidden Apollo v1 import found" >&2
                    exit 1
                  fi
                  exit 0

    test-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
            - run: go test ./...
            - run: go build -o dns-cli.exe ./cmd/dns-cli
