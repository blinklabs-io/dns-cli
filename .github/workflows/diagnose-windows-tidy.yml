name: Diagnose Windows module tidy

on:
  push:
    branches:
      - codex/go-toolchain-2026
  pull_request:
    branches:
      - main

jobs:
  tidy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
          check-latest: true
      - name: Show checkout state
        shell: bash
        run: |
          git config --show-origin --get core.autocrlf || true
          git ls-files --eol go.mod go.sum
          git status --short -- go.mod go.sum
      - name: Run module tidy
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: go mod tidy
      - name: Show module diff
        if: always()
        shell: bash
        run: |
          git status --short -- go.mod go.sum
          git diff -- go.mod go.sum
          git diff --numstat -- go.mod go.sum
