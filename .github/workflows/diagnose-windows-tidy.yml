name: Diagnose Windows module tidy

on:
  push:
    branches:
      - codex/go-toolchain-2026
  pull_request:
    branches:
      - main

jobs:
  tidy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          check-latest: true
      - name: Run module tidy
        shell: bash
        run: go mod tidy
      - name: Show module diff
        if: always()
        shell: bash
        run: git diff -- go.mod go.sum
