name: Release

on:
    push:
        tags:
            - "v*"

# Layout must match go.mod: replace apollo => ../apollo
env:
    APOLLO_REF: b2f56d0c6e9d22316b6938feeb325bdbab3846d2

jobs:
    release:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      arch: amd64
                      ext: ""
                    - os: ubuntu-latest
                      arch: arm64
                      ext: ""
                    - os: windows-latest
                      arch: amd64
                      ext: .exe
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
                working-directory: dns-cli
        steps:
            - uses: actions/checkout@v4
              with:
                  path: dns-cli
            - uses: actions/checkout@v4
              with:
                  repository: Salvionied/apollo
                  ref: ${{ env.APOLLO_REF }}
                  path: apollo
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.25.12"
                  cache-dependency-path: dns-cli/go.sum
            - name: Build
              env:
                  GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
                  GOARCH: ${{ matrix.arch }}
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  go build -ldflags "-X github.com/blinklabs-io/dns-cli/internal/cli.Version=$VERSION" -o dns-cli-${{ matrix.arch }}${{ matrix.ext }} ./cmd/dns-cli
            - uses: actions/upload-artifact@v4
              with:
                  name: dns-cli-${{ matrix.os }}-${{ matrix.arch }}
                  path: dns-cli/dns-cli-*
