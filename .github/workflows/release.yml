name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    release:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      arch: amd64
                      ext: ""
                    - os: ubuntu-latest
                      arch: arm64
                      ext: ""
                    - os: windows-latest
                      arch: amd64
                      ext: .exe
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
            - name: Build
              working-directory: dns-cli
              env:
                  GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
                  GOARCH: ${{ matrix.arch }}
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  go build -ldflags "-X github.com/blinklabs-io/dns-cli/internal/cli.Version=$VERSION" -o dns-cli-${{ matrix.arch }}${{ matrix.ext }} ./cmd/dns-cli
            - uses: actions/upload-artifact@v4
              with:
                  name: dns-cli-${{ matrix.os }}-${{ matrix.arch }}
                  path: dns-cli/dns-cli-*
